<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Calsheet · Psi Phi Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#18191d;--bar:#22242a;--panel:#2a2c33;--panel2:#33363e;--ink:#ececf2;--muted:#9a9cab;--rule:#3a3d47;--accent:#3fbf7f;--sel:#2f7df6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--bar);border-bottom:1px solid var(--rule)}
.brand{font-weight:700;white-space:nowrap}.brand b{color:var(--accent)}
#bookName{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:200px}
#bookName:focus{border-color:var(--rule);background:var(--panel)}
.grow{flex:1}
.tb{flex:none;display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--panel2)}
.tb.on{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.tb:disabled{opacity:.35}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ribbon{display:flex;align-items:center;gap:3px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
#ribbon::-webkit-scrollbar{display:none}
#ribbon select{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:5px 6px;height:34px}
.sep{width:1px;height:24px;background:var(--rule);margin:0 4px;flex:none}
.sw{position:relative}.sw i{position:absolute;left:7px;right:7px;bottom:5px;height:4px;border-radius:2px}
#fbar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:#1e2026;border-bottom:1px solid var(--rule)}
#nameBox{width:84px;text-align:center;background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:5px;font:13px ui-monospace,Menlo,monospace}
#fx{font:italic 600 14px Georgia,serif;color:var(--muted);padding:0 4px}
#formula{flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:6px 9px;font:14px ui-monospace,Menlo,monospace}
#main{flex:1;display:flex;min-height:0}
#gridWrap{flex:1;overflow:auto;position:relative;background:#fff;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#gridInner{position:relative;display:inline-block}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;color:#1c1c20;font:14px -apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
#grid th{position:sticky;background:#eef0f4;color:#5a5e6b;font:500 12px -apple-system,sans-serif;border-right:1px solid #d4d7df;border-bottom:1px solid #d4d7df;z-index:2;cursor:pointer}
#grid thead th{top:0;height:26px;text-align:center}
#grid tbody th{left:0;width:46px;text-align:center;z-index:1}
#grid thead th.corner{left:0;z-index:3}
#grid th.hl{background:#d8e6fd;color:#1d4fb0}
#grid td{height:28px;padding:0 6px;border-right:1px solid #e3e5ea;border-bottom:1px solid #e3e5ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;background:#fff}
#grid td.num{text-align:right}
#grid td.err{color:#c62828}
#grid td.bool{text-align:center}
.rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:4;touch-action:none}
#selBox{position:absolute;border:2px solid var(--sel);background:rgba(47,125,246,.08);pointer-events:none;z-index:5}
#selBox .knob{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:var(--sel);border:3px solid #fff;pointer-events:auto;touch-action:none;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#selBox.lift{box-shadow:0 10px 26px rgba(0,0,0,.35);background:rgba(47,125,246,.16)}
#selBox .edge{position:absolute;pointer-events:auto;cursor:move;touch-action:none}
#selBox .edge.t{left:0;right:0;top:-5px;height:9px}#selBox .edge.b{left:0;right:12px;bottom:-5px;height:9px}#selBox .edge.l{top:0;bottom:0;left:-5px;width:9px}#selBox .edge.r{top:0;bottom:12px;right:-5px;width:9px}
#ghost{position:absolute;border:2px dashed var(--sel);background:rgba(47,125,246,.12);pointer-events:none;z-index:7;display:none}
#actBar{position:absolute;z-index:8;display:none;gap:2px;padding:4px;background:#1c1d22;border-radius:12px;box-shadow:0 10px 26px rgba(0,0,0,.45);white-space:nowrap}
#actBar button{border:0;background:transparent;color:#fff;font:600 13px -apple-system,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer}
#actBar button:hover,#actBar button:active{background:#33363e}
#actBar i{width:1px;background:#44474f;margin:4px 2px;display:inline-block;align-self:stretch}
#refBox{position:absolute;border:2px dashed #e0782f;pointer-events:none;z-index:5;display:none}
#cellEd{position:absolute;z-index:6;border:2px solid var(--sel);padding:0 5px;font:14px -apple-system,"Helvetica Neue",Arial,sans-serif;color:#111;background:#fff;outline:none;display:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#tabs{display:flex;align-items:center;gap:4px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--rule);overflow-x:auto}
.tab{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:#111;border-color:#fff;font-weight:600}
#stat{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;padding-left:12px}
#chartPane{width:360px;flex:none;background:var(--panel);border-left:1px solid var(--rule);display:none;flex-direction:column;gap:8px;padding:10px;overflow:auto}
#chartPane.show{display:flex}
#chartPane canvas{width:100%;height:240px;background:#15161a;border-radius:10px}
#chartPane label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
#chartPane label input,#chartPane label select{flex:1;background:var(--panel2);border:1px solid var(--rule);border-radius:7px;padding:5px 7px}
.seg{display:flex;flex-wrap:wrap;gap:3px}
.seg button{border:1px solid var(--rule);background:var(--panel2);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#06210f;font-weight:600}
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,.5);padding:8px;max-height:calc(100vh - 100px);overflow:auto}
.pop .mi{display:flex;width:100%;gap:10px;align-items:baseline;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop .mi:hover{background:var(--panel2)}
.pop .mi code{font:600 13px ui-monospace,Menlo,monospace;color:var(--accent);min-width:110px}
.pop .mi small{color:var(--muted)}
.pop .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px}
.swatches{display:grid;grid-template-columns:repeat(8,26px);gap:5px}
.swatches i{width:26px;height:26px;border-radius:6px;cursor:pointer;border:1px solid rgba(0,0,0,.35)}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06210f;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--panel2);cursor:pointer;text-align:left}
.choice button.on{border-color:var(--accent);background:#1d3d2c}
.choice b{display:block}.choice small{color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:rgba(10,10,14,.94);border:1px solid var(--rule);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#gallery{position:fixed;inset:0;background:#131417;z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));overflow:auto}
#gallery[hidden]{display:none}
#gallery header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#gallery h1{margin:0;font-size:26px}
#glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px;cursor:pointer;position:relative}
.gcard small{color:var(--muted)}
.gcard .del{position:absolute;right:6px;top:6px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.5);color:#fff;cursor:pointer}
body.embed #galleryBtn{display:none}
@media (max-width:760px){#chartPane{position:fixed;right:0;top:120px;bottom:50px;z-index:20;width:min(360px,92vw)}#bookName{width:120px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="tb" id="galleryBtn" title="All spreadsheets">▤</button>
    <span class="brand">▦ <b>Calsheet</b></span>
    <input id="bookName" aria-label="Spreadsheet name" maxlength="60">
    <button class="tb" id="undoBtn" title="Undo (two-finger tap)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb" id="redoBtn" title="Redo (three-finger tap)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="grow"></span>
    <button class="tb" id="chartBtn" title="Chart from the selected cells">📊 Chart</button>
    <button class="tb" id="menuBtn" title="Spreadsheet">⋯</button>
  </header>
  <div id="ribbon"></div>
  <div id="fbar"><input id="nameBox" aria-label="Cell" title="Type a cell or range, e.g. B4 or A1:C10"><span id="fx">fx</span><input id="formula" aria-label="Contents" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a value, or = for a formula"></div>
  <div id="main">
    <div id="gridWrap"><div id="gridInner"><table id="grid"></table><div id="selBox"><span class="edge t" title="Drag to move"></span><span class="edge b" title="Drag to move"></span><span class="edge l" title="Drag to move"></span><span class="edge r" title="Drag to move"></span><span class="knob" title="Drag to select more cells"></span></div><div id="ghost"></div><div id="actBar" role="toolbar" aria-label="Cell actions"></div><div id="refBox"></div><input id="cellEd" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
    <aside id="chartPane"></aside>
  </div>
  <div id="tabs"></div>
</div>
<div id="gallery" hidden><header><h1>▦ Calsheet</h1><span class="grow"></span><button class="btn primary" id="gNew">＋ New spreadsheet</button></header><div id="glist"></div></div>
<div id="toast" role="status"></div>
<script>
'use strict';
(() => {
  const $ = s => document.querySelector(s);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k in e && k !== 'list') try { e[k] = v; } catch (x) { e.setAttribute(k, v); } else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : String(c)); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let tt = 0; const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2200); };
  const QS = new URLSearchParams(location.search), EMBED = QS.has('embed');
  if (EMBED) document.body.classList.add('embed');

  /* ================= addresses ================= */
  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const colIndex = s => { let n = 0; for (const ch of s.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
  const addr = (r, c) => colName(c) + (r + 1);
  const parseAddr = a => { const m = /^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(a); return m ? { r: +m[2] - 1, c: colIndex(m[1]) } : null; };

  /* ================= book ================= */
  let book = null, sh = null;     // current sheet
  const newSheet = name => ({ id: 'S' + uid(), name, cells: {}, cw: {}, nr: 200, nc: 26 });
  const newBook = () => ({ id: 'book_' + uid(), name: 'Untitled spreadsheet', sheets: [newSheet('Sheet 1')], active: 0, chart: { kind: 'bar', title: '', xl: '', yl: '' }, created: Date.now(), updated: Date.now() });
  const cellAt = (s, r, c) => s.cells[addr(r, c)];
  const sheetByName = n => book.sheets.find(s => s.name.toLowerCase() === String(n).toLowerCase());

  /* ================= formula engine ================= */
  class Err { constructor(e) { this.e = e; } toString() { return this.e; } }
  const E = { div: new Err('#DIV/0!'), val: new Err('#VALUE!'), ref: new Err('#REF!'), name: new Err('#NAME?'), na: new Err('#N/A'), num: new Err('#NUM!'), cyc: new Err('#CYCLE!') };
  const isErr = v => v instanceof Err;
  function tokenize(src) {
    const T = []; let i = 0;
    const RE_REF = /^(?:('(?:[^']|'')+'|[A-Za-z_][\w.]*)!)?(\$?[A-Za-z]{1,3}\$?\d+)(?::(\$?[A-Za-z]{1,3}\$?\d+))?/;
    while (i < src.length) {
      const ch = src[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (ch === '"') { let j = i + 1, s = ''; while (j < src.length) { if (src[j] === '"') { if (src[j + 1] === '"') { s += '"'; j += 2; continue; } break; } s += src[j++]; } T.push({ t: 'str', v: s }); i = j + 1; continue; }
      const num = /^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(src.slice(i)); if (num && !/[A-Za-z_]/.test(src[i + num[0].length] || '')) { T.push({ t: 'num', v: parseFloat(num[0]) }); i += num[0].length; continue; }
      const rest = src.slice(i), rm = RE_REF.exec(rest);
      if (rm && !/^[\w(]/.test(rest.slice(rm[0].length)) ) { T.push({ t: 'ref', sheet: rm[1] ? rm[1].replace(/^'|'$/g, '').replace(/''/g, "'") : null, a: rm[2], b: rm[3] || null }); i += rm[0].length; continue; }
      const id = /^[A-Za-z_][\w.]*/.exec(rest);
      if (id) { const w = id[0].toUpperCase(); i += id[0].length; if (src[i] === '(') { T.push({ t: 'fn', v: w }); i++; } else if (w === 'TRUE' || w === 'FALSE') T.push({ t: 'bool', v: w === 'TRUE' }); else T.push({ t: 'name', v: w }); continue; }
      const two = src.substr(i, 2); if (['<=', '>=', '<>'].includes(two)) { T.push({ t: 'op', v: two }); i += 2; continue; }
      if ('+-*/^&=<>(),%:;'.includes(ch)) { T.push({ t: ch === '(' || ch === ')' || ch === ',' || ch === ';' ? ch === ';' ? ',' : ch : 'op', v: ch }); i++; continue; }
      throw E.name;
    }
    return T;
  }
  function parse(src) {
    const T = tokenize(src); let p = 0;
    const peek = () => T[p], next = () => T[p++], isOp = (...o) => T[p] && T[p].t === 'op' && o.includes(T[p].v);
    const cmp = () => { let a = cat(); while (isOp('=', '<>', '<', '>', '<=', '>=')) { const o = next().v; a = { k: 'bin', o, a, b: cat() }; } return a; };
    const cat = () => { let a = add(); while (isOp('&')) { next(); a = { k: 'bin', o: '&', a, b: add() }; } return a; };
    const add = () => { let a = mul(); while (isOp('+', '-')) { const o = next().v; a = { k: 'bin', o, a, b: mul() }; } return a; };
    const mul = () => { let a = pow(); while (isOp('*', '/')) { const o = next().v; a = { k: 'bin', o, a, b: pow() }; } return a; };
    const pow = () => { let a = un(); while (isOp('^')) { next(); a = { k: 'bin', o: '^', a, b: un() }; } return a; };
    const un = () => { if (isOp('-')) { next(); return { k: 'neg', a: un() }; } if (isOp('+')) { next(); return un(); } let a = prim(); while (isOp('%')) { next(); a = { k: 'pct', a }; } return a; };
    const prim = () => {
      const t = next(); if (!t) throw E.val;
      if (t.t === 'num') return { k: 'num', v: t.v }; if (t.t === 'str') return { k: 'str', v: t.v }; if (t.t === 'bool') return { k: 'bool', v: t.v };
      if (t.t === 'ref') return { k: 'ref', sheet: t.sheet, a: t.a, b: t.b };
      if (t.t === 'name') return { k: 'name', v: t.v };
      if (t.t === '(') { const e = cmp(); if (!peek() || next().t !== ')') throw E.val; return e; }
      if (t.t === 'fn') { const args = []; if (peek() && peek().t === ')') { next(); return { k: 'fn', v: t.v, args }; } for (; ;) { if (peek() && (peek().t === ',' || peek().t === ')')) args.push({ k: 'blank' }); else args.push(cmp()); const s = next(); if (!s) throw E.val; if (s.t === ')') break; if (s.t !== ',') throw E.val; } return { k: 'fn', v: t.v, args }; }
      throw E.val;
    };
    const e = cmp(); if (p < T.length) throw E.val; return e;
  }
  const astCache = new Map();
  const astOf = src => { let a = astCache.get(src); if (!a) { try { a = parse(src); } catch (e) { a = { k: 'err', e: isErr(e) ? e : E.val }; } if (astCache.size > 5000) astCache.clear(); astCache.set(src, a); } return a; };
  // values: number | string | boolean | Err | null (blank) | {arr:[[...]]}
  let memo = new Map(), visiting = new Set();
  function literal(raw) {
    if (raw == null || raw === '') return null;
    const s = String(raw).trim();
    if (/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return parseFloat(s);
    if (/^[-+]?\d+(\.\d+)?%$/.test(s)) return parseFloat(s) / 100;
    if (/^(true|false)$/i.test(s)) return /^true$/i.test(s);
    return String(raw);
  }
  function valueOf(sheet, r, c) {
    const key = sheet.id + '|' + r + '|' + c; if (memo.has(key)) return memo.get(key);
    const cell = sheet.cells[addr(r, c)]; if (!cell || cell.v == null || cell.v === '') return null;
    let v;
    if (typeof cell.v === 'string' && cell.v[0] === '=' && cell.v.length > 1) {
      if (visiting.has(key)) return E.cyc; visiting.add(key);
      try { v = evalNode(astOf(cell.v.slice(1)), sheet); if (v && v.arr) v = v.arr[0] ? v.arr[0][0] : null; if (v == null) v = 0; } catch (e) { v = isErr(e) ? e : E.val; }
      visiting.delete(key);
    } else v = literal(cell.v);
    memo.set(key, v); return v;
  }
  function rangeVals(sheet, a, b) {
    const A = parseAddr(a), B = b ? parseAddr(b) : A; if (!A || !B) throw E.ref;
    const r0 = Math.min(A.r, B.r), r1 = Math.max(A.r, B.r), c0 = Math.min(A.c, B.c), c1 = Math.max(A.c, B.c), arr = [];
    for (let r = r0; r <= r1; r++) { const row = []; for (let c = c0; c <= c1; c++) row.push(valueOf(sheet, r, c)); arr.push(row); }
    return { arr };
  }
  const toNum = v => { if (isErr(v)) throw v; if (v == null || v === '') return 0; if (typeof v === 'boolean') return v ? 1 : 0; if (typeof v === 'number') return v; const n = literal(v); if (typeof n === 'number') return n; const d = parseDate(v); if (d != null) return d; throw E.val; };
  const toStr = v => { if (isErr(v)) throw v; if (v == null) return ''; if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE'; if (typeof v === 'number') return fmtGeneral(v); return String(v); };
  const toBool = v => { if (isErr(v)) throw v; if (typeof v === 'string') { if (/^true$/i.test(v)) return true; if (/^false$/i.test(v)) return false; throw E.val; } return !!v; };
  const scalar = v => v && v.arr ? (v.arr[0] ? v.arr[0][0] : null) : v;
  function evalNode(n, sheet) {
    switch (n.k) {
      case 'num': case 'str': case 'bool': return n.v;
      case 'blank': return null;

  function renderChart() {
    const P = $('#chartPane'); if (!P.classList.contains('show')) return; const o = book.chart;
    P.innerHTML = '';
    const cv = h('canvas', {});
    const seg = h('div', { class: 'seg' }, [['bar', 'Column'], ['line', 'Line'], ['scatter', 'Scatter'], ['pie', 'Pie'], ['donut', 'Donut']].map(([k, l]) => h('button', { class: o.kind === k ? 'on' : '', onclick: () => { o.kind = k; renderChart(); saveSoon(); } }, l)));
    P.append(h('b', {}, 'Chart · ' + selAddr()), seg, cv,
      h('label', {}, 'Title', h('input', { value: o.title, oninput: e => { o.title = e.target.value; drawChart(cv, chartData(), o); saveSoon(); } })),
      h('label', {}, 'x-axis', h('input', { value: o.xl, oninput: e => { o.xl = e.target.value; drawChart(cv, chartData(), o); saveSoon(); } })),
      h('label', {}, 'y-axis', h('input', { value: o.yl, oninput: e => { o.yl = e.target.value; saveSoon(); } })),
      h('div', { class: 'small' }, 'Select the cells to plot: headings in the first row, labels (or x values) in the first column, then one column per series. Tap ✓ Use in scene in Psi Phi Studio to make it an animated chart.'));

  }
  $('#chartBtn').addEventListener('click', () => { const P = $('#chartPane'); P.classList.toggle('show'); $('#chartBtn').classList.toggle('on', P.classList.contains('show')); renderChart(); });

  /* ================= storage ================= */
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('psiphi-calsheet', 1); r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('books')) r.result.createObjectStore('books', { keyPath: 'id' }); }; r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('books', mode), st = t.objectStore('books'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  let saveT = 0; const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(saveNow, 800); };
  async function saveNow() {
    if (!book) return; clearTimeout(saveT); book.updated = Date.now();
    // keep what each sheet shows, so the side panel in Psi Phi Studio can display it without recalculating
    memo = new Map(); visiting = new Set();
    for (const s of book.sheets) { const u = usedRange(s), view = []; for (let r = 0; r < Math.min(u.nr, 500); r++) { const row = []; for (let c = 0; c < Math.min(u.nc, 40); c++) { const cell = s.cells[addr(r, c)], v = valueOf(s, r, c), d = display(v, cell && cell.s); row.push(d.t ? [d.t, d.cls === 'num' ? 1 : 0, cell && cell.s && (cell.s.b ? 1 : 0), cell && cell.s && cell.s.bg || ''] : null); } view.push(row); } s.view = view; }
    try { await tx('readwrite', st => st.put(book)); } catch (e) { console.warn('save failed', e); }
  }
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

  /* ================= gallery & open ================= */
  async function openGallery() {
    await saveNow(); const g = $('#gallery'), list = $('#glist'); g.hidden = false; list.innerHTML = '';
    const all = ((await tx('readonly', st => st.getAll()).catch(() => [])) || []).sort((a, b) => b.updated - a.updated);
    if (!all.length) list.append(h('p', { class: 'small' }, 'No spreadsheets yet.'));
    for (const b of all) list.append(h('div', { class: 'gcard', onclick: () => { g.hidden = true; openBook(b); } }, h('b', {}, b.name), h('br'), h('small', {}, b.sheets.length + ' sheet' + (b.sheets.length > 1 ? 's' : '') + ' · ' + new Date(b.updated).toLocaleDateString()),
      h('button', { class: 'del', title: 'Delete', onclick: async ev => { ev.stopPropagation(); if (confirm('Delete “' + b.name + '”?')) { await tx('readwrite', st => st.delete(b.id)); openGallery(); } } }, '✕')));
  }
  $('#galleryBtn').addEventListener('click', openGallery); $('#gNew').addEventListener('click', async () => { await saveNow(); $('#gallery').hidden = true; openBook(newBook()); });
  $('#bookName').addEventListener('change', e => { book.name = e.target.value.trim() || book.name; e.target.value = book.name; saveSoon(); });
  function openBook(b) { book = b; book.chart = book.chart || { kind: 'bar', title: '', xl: '', yl: '' }; sh = book.sheets[book.active || 0] || book.sheets[0]; $('#bookName').value = book.name; buildGrid(); renderTabs(); select(0, 0); recalc(); hist.length = 0; hpos = -1; record(); saveSoon(); }

  /* ================= Psi Phi Studio: bring cells into the scene ================= */
  const toParent = (m, tr) => { try { if (window.parent !== window) window.parent.postMessage(m, '*', tr || []); } catch (e) { } };
  let ready = false;
  function sceneChoice() {
    const n = norm(sel), many = n.r1 > n.r0 || n.c1 > n.c0;
    return new Promise(res => {
      let pick = many ? 'table' : 'panel', kind = book.chart.kind || 'bar', header = true;
      const d = h('dialog', {}), body = h('div', { class: 'dlg' });
      const opt = (k, title, sub, dis) => h('button', { class: pick === k ? 'on' : '', disabled: !!dis, onclick: () => { pick = k; render(); } }, h('b', {}, title), h('small', {}, sub));
      const render = () => { body.innerHTML = ''; body.append(h('h2', {}, 'Bring into your scene'), h('div', { class: 'choice' },
        opt('table', 'Selected cells as a table', many ? selAddr() + ' as an animatable table.' : 'Select a block of cells first.', !many),
        opt('chart', 'Selected cells as a chart', many ? 'An animated chart that draws itself in.' : 'Select a block of cells first.', !many),
        opt('panel', 'Show this sheet beside the stage', 'A side panel with the data, to read from while you record or edit.')),
        pick === 'table' ? h('label', { class: 'row small' }, h('input', { type: 'checkbox', checked: header, onchange: e => { header = e.target.checked; } }), 'First row is headings') : null,
        pick === 'chart' ? h('div', { class: 'seg' }, [['bar', 'Column'], ['line', 'Line'], ['scatter', 'Scatter'], ['pie', 'Pie'], ['donut', 'Donut']].map(([k, l]) => h('button', { class: kind === k ? 'on' : '', onclick: () => { kind = k; render(); } }, l))) : null,
        h('div', { class: 'row', style: 'justify-content:flex-end' }, h('button', { class: 'btn', onclick: () => { d.close(); res(null); } }, 'Cancel'), h('button', { class: 'btn primary', onclick: () => { d.close(); res({ pick, kind, header }); } }, '✓ Use in scene'))); };
      render(); d.append(body); d.addEventListener('cancel', () => res(null)); d.addEventListener('close', () => setTimeout(() => d.remove(), 50)); document.body.append(d); d.showModal();
    });
  }
  if (EMBED) addEventListener('message', async e => {
    if (e.source !== window.parent) return; const m = e.data || {};
    if (m.type === 'st-ping' && ready) toParent({ type: 'st-ready', projId: book.id });
    if (m.type !== 'st-export') return;
    try {
      commitEdit(); await saveNow(); const ch = m.auto || await sceneChoice(); if (!ch) { toParent({ type: 'st-cancel' }); return; }
      const base = { type: 'st-result', name: book.name + (book.sheets.length > 1 ? ' · ' + sh.name : ''), projId: book.id, sheetId: sh.id, app: 'calsheet', range: selAddr() };
      if (ch.pick === 'panel') return toParent(Object.assign(base, { kind: 'panel', source: 'calsheet' }));
      const n = norm(sel);
      if (ch.pick === 'table') return toParent(Object.assign(base, { kind: 'table', csv: sheetCSV(sh, n, false), header: ch.header }));
      const D = chartData(); if (!D || !D.series.length) { toast('Those cells have no numbers to chart.'); return toParent({ type: 'st-cancel' }); }
      const rows = [[D.catName || 'label', ...D.series.map(s => s.name)], ...D.cats.map((c, i) => [c, ...D.series.map(s => s.vals[i] == null ? '' : +(+s.vals[i]).toPrecision(10))])];
      toParent(Object.assign(base, { kind: 'chart', chart: ch.kind, csv: rows.map(r => r.map(v => csvCell(String(v))).join(',')).join('\n'), title: book.chart.title || '', xlabel: book.chart.xl || D.catName || '', ylabel: book.chart.yl || (D.series.length === 1 ? D.series[0].name : '') }));
    } catch (err) { toParent({ type: 'st-error', message: (err && err.message) || String(err) }); }
  });
  window.Calsheet = { get book() { return book; }, get sheet() { return sh; }, setCell: (a, v) => { const p = parseAddr(a); setCell(p.r, p.c, v); change(); }, value: a => { const p = parseAddr(a); memo = new Map(); return valueOf(sh, p.r, p.c); }, display: a => { const p = parseAddr(a); const c = sh.cells[a]; return display(valueOf(sh, p.r, p.c), c && c.s).t; }, select: (a, b) => { const p = parseAddr(a), q = parseAddr(b || a); select(p.r, p.c, q.r, q.c); }, styleSel, insertRow, deleteRows, insertCol, sortSel, fill, chartData, undo, redo, saveNow, sceneChoice, readXLSX };

  buildRibbon();
  (async () => {

})();
