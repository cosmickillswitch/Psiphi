<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tabula · Psi Phi Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#151518;--bar:rgba(22,22,26,.92);--panel:#232329;--panel2:#2d2d35;--panel3:#393943;--ink:#f0f0f5;--muted:#9b9bab;--rule:#3a3a46;--accent:#4aa3ff;--warm:#f0ac5f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:5px 8px}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:#3a3a40}
#top{position:fixed;left:0;right:0;top:0;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 10px 0;display:flex;align-items:center;gap:4px;background:var(--bar);backdrop-filter:blur(10px);z-index:10}
.tb{display:inline-grid;place-items:center;min-width:40px;height:38px;padding:0 9px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:15px}
.tb:hover{background:rgba(255,255,255,.07)}
.tb.on{color:var(--accent)}
.tb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb .lbl{font-size:14px;font-weight:500}
.grow{flex:1}
#colourBtn{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);margin-left:6px;padding:0;touch-action:none}
#docTitle{font-weight:600;color:var(--muted);font-size:13px;margin-left:6px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#side{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:9;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bar);border-radius:14px;padding:10px 6px;backdrop-filter:blur(10px)}
.vslider{position:relative;width:30px;height:150px;border-radius:15px;background:#111;touch-action:none;cursor:ns-resize;overflow:hidden}
.vslider i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#5a5a66,#3c3c46)}
.vslider b{position:absolute;left:3px;right:3px;height:12px;border-radius:6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
#modBtn{width:30px;height:30px;border-radius:7px;border:1px solid #666;background:#1b1b20;cursor:pointer}
#side .tb{min-width:34px;height:34px;padding:0}
#sliderTip{position:fixed;left:56px;z-index:12;background:rgba(10,10,14,.92);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;font-size:13px;pointer-events:none;display:none}
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.55);max-height:calc(100vh - 80px);overflow:auto;-webkit-overflow-scrolling:touch}
.pop h3{margin:0;padding:12px 14px 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.pop h3 .grow{flex:1}
.pbtn{border:1px solid var(--rule);background:var(--panel2);border-radius:9px;padding:6px 11px;cursor:pointer}
.pbtn:hover{background:var(--panel3)}
.pbtn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
.pbtn.on{border-color:var(--accent);color:var(--accent)}
.pbtn.sm{padding:4px 8px;font-size:12px}
/* brushes */
#brushPop{width:430px;display:grid;grid-template-columns:130px 1fr}
#brushPop h3{grid-column:1/-1}
.bcats{border-right:1px solid var(--rule);padding:4px}
.bcats button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.bcats button.on{background:var(--accent);color:#04121f}
.blist{padding:6px;display:flex;flex-direction:column;gap:6px}
.bitem{display:flex;flex-direction:column;gap:2px;border:1px solid transparent;border-radius:10px;padding:6px 8px;background:var(--panel2);cursor:pointer}
.bitem.on{border-color:var(--accent)}
.bitem span{font-size:13px}
.bitem canvas{width:100%;height:42px}
.bset{grid-column:1/-1;border-top:1px solid var(--rule);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bset input[type=range]{flex:1}
/* layers */
#layerPop{width:330px;padding-bottom:8px}
.lrow{display:flex;align-items:center;gap:10px;margin:4px 8px;padding:6px 8px;border-radius:10px;background:var(--panel2);cursor:pointer;border:1px solid transparent}
.lrow.on{background:#1d4f86;border-color:var(--accent)}
.lrow canvas{width:46px;height:34px;border-radius:4px;flex:none;background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;color:var(--muted);font-size:11px}
.lrow .bm{width:26px;height:26px;border-radius:6px;border:0;background:rgba(255,255,255,.08);cursor:pointer;font-size:12px;font-weight:700}
.lrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.lrow.clip{margin-left:26px}
.lrow .bgsw{width:46px;height:34px;border-radius:4px;flex:none;border:1px solid var(--rule)}
.lmenu{margin:2px 8px 8px 8px;padding:8px;border-radius:10px;background:#1b1b21;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lmenu button{border:0;background:var(--panel2);border-radius:8px;padding:8px;cursor:pointer;text-align:left;font-size:13px}
.lmenu button.on{background:var(--accent);color:#04121f}
.lmenu .full{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lmenu select{flex:1}
/* colour */
#colourPop{width:320px;padding:0 14px 14px}
#sv{width:100%;height:190px;border-radius:12px;touch-action:none;display:block}
#hueBar{width:100%;height:22px;border-radius:11px;margin-top:10px;touch-action:none;display:block}
.chist{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}
.chist i{aspect-ratio:1;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.5)}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.pal i{aspect-ratio:1;border-radius:5px;cursor:pointer;border:1px solid rgba(0,0,0,.4)}
.small{font-size:12px;color:var(--muted)}
/* menus */
.menuPop{min-width:270px;padding:6px}
.menuPop button.mi{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:10px;border-radius:9px;cursor:pointer;text-align:left}
.menuPop button.mi:hover{background:var(--panel2)}
.menuPop button.mi span{flex:1}
.menuPop button.mi em{font-style:normal;color:var(--accent);font-size:12px}
.menuPop hr{border:0;border-top:1px solid var(--rule);margin:4px 6px}
.menuPop .cap{padding:6px 10px 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* bottom panels */
#anim{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#anim[hidden]{display:none}
#frames{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:3px}
.fthumb{position:relative;flex:none;height:62px;border-radius:7px;border:2px solid transparent;cursor:pointer;overflow:hidden;background:#fff}
.fthumb.on{border-color:var(--accent)}
.fthumb canvas{display:block;height:100%}
.fthumb span{position:absolute;left:4px;bottom:2px;font-size:10px;font-weight:700;color:#000;background:rgba(255,255,255,.75);border-radius:4px;padding:0 3px}
#adjPanel,#tfPanel{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:11;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:min(440px,92vw);box-shadow:0 12px 30px rgba(0,0,0,.5)}
#adjPanel[hidden],#tfPanel[hidden]{display:none}
#selPanel{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:11;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:96vw;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#selPanel[hidden]{display:none}
.seg{display:inline-flex;background:#17171c;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:#04121f;font-weight:600}
#selChip{position:fixed;left:62px;top:calc(54px + env(safe-area-inset-top));z-index:9;border:1px solid var(--rule);background:var(--bar);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink)}
#selChip[hidden]{display:none}
body.anim-on #selPanel,body.anim-on #tfPanel{bottom:calc(96px + env(safe-area-inset-bottom))}
#adjPanel label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
#adjPanel label span{width:90px}
#adjPanel input[type=range]{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(10,10,14,.92);border:1px solid var(--rule);padding:7px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:40;text-align:center;max-width:86vw}
#toast.show{opacity:1}
#dropDot{position:fixed;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #fff;z-index:30;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.5)}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.presets button{padding:12px 8px;border-radius:12px;border:1px solid var(--rule);background:var(--panel2);cursor:pointer;text-align:left}
.presets button:hover{border-color:var(--accent)}
.presets b{display:block}
.presets small{color:var(--muted)}
.choice{display:flex;gap:8px}
.choice button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--panel2);cursor:pointer;text-align:left}
.choice button.on{border-color:var(--accent);background:#173a61}
.choice b{display:block}
.choice small{color:var(--muted)}
#gallery{position:fixed;inset:0;background:#0f0f12;z-index:30;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));overflow:auto}
#gallery[hidden]{display:none}
#gallery header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
#gallery h1{margin:0;font-size:28px}
#glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.gcard{cursor:pointer;position:relative}
.gcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#222;border-radius:10px}
.gcard div{padding:6px 2px;font-size:13px}
.gcard small{color:var(--muted)}
.gcard .del{position:absolute;right:6px;top:6px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.6);cursor:pointer}
body.embed #galleryBtn{display:none}
body.zen #top,body.zen #side,body.zen #anim{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<header id="top">
  <button class="tb" id="galleryBtn"><span class="lbl">Gallery</span></button>
  <button class="tb" id="actBtn" title="Actions"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8V20h3.2l5.3-5.3a4 4 0 0 0 5.2-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/></svg></button>
  <button class="tb" id="adjBtn" title="Adjustments"><svg viewBox="0 0 24 24"><path d="M5 19L15 9"/><path d="M15 9l2-2"/><path d="M18 3v3M16.5 4.5h3M20 9v2M19 10h2M11 3v2M10 4h2"/></svg></button>
  <button class="tb" id="selBtn" title="Selection"><svg viewBox="0 0 24 24"><path d="M5 9c0-3 3.5-5 7.5-5S20 6 20 9s-3.5 5-7.5 5c-1.2 0-2.4-.2-3.4-.5" stroke-dasharray="2.6 2.2"/><path d="M8 13c-2 0-3 1.3-3 2.6S6.3 18 8 18c1.3 0 2-1 2-2.2S9.3 13 8 13z"/><path d="M8 18v3"/></svg></button>
  <button class="tb" id="tfBtn" title="Transform the layer"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><path d="M11 5h8v8"/></svg></button>
  <span id="docTitle"></span>
  <span class="grow"></span>
  <button class="tb" id="animBtn" title="Animation"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 6v12M17 6v12M3 10h4M3 14h4M17 10h4M17 14h4"/></svg></button>
  <button class="tb" id="brushBtn" title="Paint (brush library)"><svg viewBox="0 0 24 24"><path d="M20 4c-3 1-8 6-10 9l2 2c3-2 8-7 9-10z"/><path d="M9 14c-2 0-4 1-4 3s-1 3-2 3c3 1 7 0 7-3z"/></svg></button>
  <button class="tb" id="blendBtn" title="Blend (N)"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg></button>
  <button class="tb" id="smudgeBtn" title="Smudge"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v5"/><path d="M12 10V4a1.5 1.5 0 0 1 3 0v6"/><path d="M15 10V6a1.5 1.5 0 0 1 3 0v8c0 4-3 7-7 7-3 0-5-2-6-5l-1-3a1.5 1.5 0 0 1 2.7-1.2L9 14"/></svg></button>
  <button class="tb" id="eraserBtn" title="Eraser"><svg viewBox="0 0 24 24"><path d="M8 20h11"/><path d="M4 15l9-9 6 6-8 8H9z"/><path d="M9 10l6 6"/></svg></button>
  <button class="tb" id="layersBtn" title="Layers"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg></button>
  <button class="tb" id="colourBtn" title="Colour (drag onto the canvas to fill)"></button>
</header>
<div id="side">
  <div class="vslider" id="sizeSl" title="Brush size"><i></i><b></b></div>
  <button id="modBtn" title="Hold, then touch the canvas to pick a colour"></button>
  <div class="vslider" id="opSl" title="Opacity"><i></i><b></b></div>
  <button class="tb" id="undoBtn" title="Undo (two-finger tap)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="tb" id="redoBtn" title="Redo (three-finger tap)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
</div>
<div id="sliderTip"></div>
<div id="anim" hidden>
  <button class="tb" id="playBtn" title="Play"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg></button>
  <div id="frames"></div>
  <button class="tb" id="frAdd" title="Add a blank frame">＋</button>
  <button class="tb" id="frDup" title="Duplicate this frame">⧉</button>
  <button class="tb" id="frDel" title="Delete this frame">🗑</button>
  <button class="tb" id="animSet" title="Animation settings">⚙</button>
</div>
<div id="adjPanel" hidden></div>
<div id="tfPanel" hidden></div>
<div id="selPanel" hidden></div>
<button id="selChip" hidden>Selection on · <b>Deselect</b></button>
<div id="dropDot"></div>
<div id="gallery" hidden><header><h1>Tabula</h1><span class="grow"></span><button class="pbtn primary" id="gNew">＋ New canvas</button></header><div id="glist"></div></div>
<div id="toast" role="status"></div>
<script>
'use strict';
(() => {
  const $ = s => document.querySelector(s);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k in e && k !== 'list') try { e[k] = v; } catch (x) { e.setAttribute(k, v); } else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : String(c)); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let tt = 0; const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2000); };
  const QS = new URLSearchParams(location.search), EMBED = QS.has('embed');
  if (EMBED) document.body.classList.add('embed');
  const canvas = (w, hh) => { const c = document.createElement('canvas'); c.width = w; c.height = hh; return c; };
  const ctx2 = c => c.getContext('2d');
  const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
  function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

  /* ================= brushes ================= */
  // tex: which paper texture shows through (paper, canvas, rough); wet: how much colour it picks up from the picture;
  // hue/lum: colour variation per dab; scatter, sizeJit, angle as before
  const BRUSHES = [
    { id: 'hb', cat: 'Sketching', name: 'HB Pencil', tip: 'pencil', size: 5, max: 40, op: 0.85, flow: 0.5, spacing: 0.1, pSize: 0.35, pOp: 0.8, grain: 0.75, stream: 0.2, tilt: true },
    { id: '6b', cat: 'Sketching', name: '6B Pencil', tip: 'pencil', size: 14, max: 90, op: 1, flow: 0.65, spacing: 0.08, pSize: 0.45, pOp: 0.7, grain: 0.9, tex: 'rough', stream: 0.15, tilt: true },
    { id: 'mech', cat: 'Sketching', name: 'Mechanical Pencil', tip: 'round', size: 3, max: 16, op: 0.9, flow: 0.7, spacing: 0.08, pSize: 0.1, pOp: 0.6, grain: 0.5, stream: 0.3 },
    { id: 'blue', cat: 'Sketching', name: 'Blue Sketch', tip: 'pencil', size: 6, max: 40, op: 0.55, flow: 0.55, spacing: 0.1, pSize: 0.3, pOp: 0.7, grain: 0.7, stream: 0.25, tilt: true, fixCol: '#5b8fd6' },
    { id: 'ballpoint', cat: 'Sketching', name: 'Ballpoint', tip: 'round', size: 3, max: 14, op: 0.95, flow: 0.85, spacing: 0.06, pSize: 0.25, pOp: 0.5, grain: 0.2, stream: 0.35 },
    { id: 'studio', cat: 'Inking', name: 'Studio Pen', tip: 'round', size: 10, max: 120, op: 1, flow: 1, spacing: 0.04, pSize: 0.85, pOp: 0, stream: 0.55, taper: 1 },
    { id: 'tech', cat: 'Inking', name: 'Technical Pen', tip: 'round', size: 6, max: 80, op: 1, flow: 1, spacing: 0.04, pSize: 0.1, pOp: 0, stream: 0.5 },
    { id: 'fine', cat: 'Inking', name: 'Fineliner', tip: 'round', size: 4, max: 30, op: 1, flow: 1, spacing: 0.04, pSize: 0.05, pOp: 0, stream: 0.6 },
    { id: 'nib', cat: 'Inking', name: 'Dip Nib', tip: 'nib', size: 16, max: 120, op: 1, flow: 1, spacing: 0.03, pSize: 1, pOp: 0, angle: 'fixed', ang: 0.8, stream: 0.5, taper: 1 },
    { id: 'dryink', cat: 'Inking', name: 'Dry Ink', tip: 'ink', size: 14, max: 140, op: 1, flow: 0.95, spacing: 0.05, pSize: 0.7, pOp: 0.2, grain: 0.5, tex: 'rough', stream: 0.35 },
    { id: 'felt', cat: 'Inking', name: 'Felt Tip', tip: 'round', size: 12, max: 60, op: 0.85, flow: 0.6, spacing: 0.05, pSize: 0.2, pOp: 0.2, grain: 0.25, stream: 0.35 },
