<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ClayForm</title>
<meta name="theme-color" content="#17171D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Clayframe · a sculpt-and-animate app. Big 3D view, mode tabs, a timeline and a tool row; panels pop up over the lower half on phones and dock right on wide screens. */
:root{
  --bg:#0E0E12;--panel:#17171D;--panel2:#202029;--panel3:#2A2A35;--ink:#EEEDF2;--muted:#9393A6;--rule:#2B2B37;--field:#101015;
  --accent:#E9A15B;--accent-ink:#1E1004;--key:#F2B35E;--sel:#5BC0FF;--danger:#F2685B;--rec:#FF4D57;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --barh:50px;--sheetw:370px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,select,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:.82rem;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.bar{height:var(--barh);flex:none;display:flex;align-items:center;gap:6px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;flex:none}
.brand svg{width:30px;height:30px;border-radius:8px}
.brand b{font-weight:600;letter-spacing:-.01em}
@media (max-width:440px){.brand b{display:none}}
#proj{max-width:160px;min-width:0;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:6px 8px;min-height:36px}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:9px;padding:7px 13px;min-height:38px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--danger)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.iconbtn{background:transparent;border:1px solid transparent;border-radius:9px;min-width:38px;min-height:38px;display:inline-grid;place-items:center;font-size:1.05rem;padding:0 6px}
.iconbtn:hover{background:var(--panel2)}
.iconbtn:disabled{opacity:.35}
.tog[aria-pressed="true"]{background:var(--panel3);border-color:var(--accent);color:var(--accent)}
.iconbtn.rec[aria-pressed="true"]{color:var(--rec);border-color:var(--rec)}

.main{flex:1;min-height:0;display:flex;flex-direction:column}
.viewwrap{position:relative;flex:1;min-height:180px;background:#24242A;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#view,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
.sliders{position:absolute;left:8px;top:12px;bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:18px;pointer-events:none}
.vs{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(14,14,18,.55);border-radius:14px;padding:8px 6px;backdrop-filter:blur(6px)}
.vs span{font-size:.68rem;color:var(--muted)}
.vs input{writing-mode:vertical-lr;direction:rtl;width:30px;height:clamp(80px,22vh,170px);accent-color:var(--accent);margin:0}
.viewbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.vbtn{background:rgba(14,14,18,.6);border:1px solid var(--rule);border-radius:10px;min-width:44px;min-height:38px;padding:0 8px;font-size:.85rem;backdrop-filter:blur(6px)}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(14,14,18,.8);border:1px solid var(--accent);border-radius:99px;padding:6px 8px 6px 14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 130px);font-size:.85rem}
.banner .btn{min-height:30px;padding:3px 10px}

.modes{flex:none;display:flex;gap:2px;padding:4px 8px;background:var(--panel);border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.modes button{flex:1;min-width:64px;border:0;background:transparent;border-radius:8px;padding:6px 4px;font-weight:600;font-size:.85rem;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--panel3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}

.transport{flex:none;display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--panel);border-top:1px solid var(--rule)}
.playbtn{width:40px;height:36px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.time{font-family:var(--f-mono);font-size:.85rem;margin-left:6px}
.keybtn{background:transparent;border:1px solid var(--rule);border-radius:8px;min-width:34px;min-height:34px;color:var(--key);font-size:1rem}
.keybtn.on{background:var(--key);color:#2A1700;border-color:var(--key)}
.keybtn.some{border-color:var(--key)}
.keybtn.big{min-width:42px}

.tl{flex:none;height:132px;background:var(--panel);border-top:1px solid var(--rule);position:relative;overflow:hidden}
.tl.closed{height:0;border:0}
.tl-scroll{position:absolute;inset:0;overflow-x:auto;overflow-y:auto;scrollbar-width:none;touch-action:pan-x pan-y}
.tl-scroll::-webkit-scrollbar{display:none}
.tl-inner{position:relative;min-height:100%}
.tl-ruler{position:sticky;top:0;height:20px;background:var(--panel);z-index:3;border-bottom:1px solid var(--rule)}
.tl-tick{position:absolute;top:0;height:20px;border-left:1px solid var(--rule);font:10px var(--f-mono);color:var(--muted);padding-left:3px}
.tl-end{position:absolute;top:0;bottom:0;width:2px;background:var(--rule)}
.tl-row{position:relative;height:26px;border-bottom:1px solid rgba(255,255,255,.04)}
.tl-row.sel{background:rgba(233,161,91,.07)}
.tl-row.chan{height:22px;background:rgba(0,0,0,.18)}
.tl-label{position:sticky;left:0;z-index:2;display:inline-flex;align-items:center;height:100%;max-width:150px;padding:0 8px;font-size:.75rem;background:linear-gradient(90deg,var(--panel) 75%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.tl-row.chan .tl-label{font-size:.7rem;color:var(--muted);padding-left:18px}
.tl-span{position:absolute;top:9px;height:8px;background:rgba(242,179,94,.16);border-radius:4px}
.tl-key{position:absolute;top:6px;width:14px;height:14px;margin-left:-7px;background:var(--key);transform:rotate(45deg) scale(.78);border:1px solid #2A1700;border-radius:2px;touch-action:none;cursor:grab}
.tl-row.chan .tl-key{top:5px;width:12px;height:12px;margin-left:-6px;opacity:.8}
.tl-key.at{background:#fff}
.tl-ph{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--sel);z-index:4;pointer-events:none}
.tl-ph::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--sel)}

.tools{flex:none;display:flex;gap:4px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--panel2);border-top:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;min-width:60px;border:1px solid transparent;background:transparent;border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool .ti{font-size:1.15rem;line-height:1.3}
.tool .tlab{font-size:.68rem;color:var(--muted);white-space:nowrap}
.tool.active{background:var(--panel3);border-color:var(--accent)}
.tool.active .tlab{color:var(--ink)}
.tool:disabled{opacity:.35}
.tool.sep{min-width:1px;width:1px;padding:0;margin:4px 2px;background:var(--rule)}

.sheet{position:fixed;left:0;right:0;bottom:0;max-height:min(62vh,560px);background:var(--panel);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;z-index:20;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 16px;border-bottom:1px solid var(--rule);-webkit-user-select:none;user-select:none}
.sheet-head b{flex:1}
.sheet-body{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:900px){
  .sheet{top:var(--barh);bottom:0;left:auto;right:0;width:var(--sheetw);max-height:none;border-radius:0;border-top:0;border-left:1px solid var(--rule)}
  body.docked .main{margin-right:var(--sheetw)}
}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h3{margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=number],select{background:var(--field);border:1px solid var(--rule);border-radius:8px;padding:7px 9px;min-height:38px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:1px solid var(--rule);background:var(--panel2);border-radius:99px;padding:6px 12px;font-size:.85rem}
.pick.on{border-color:var(--accent);background:var(--panel3);color:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{border:1px solid var(--rule);background:var(--panel2);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem}
.tile .ic{font-size:1.6rem;line-height:1}
.tile.on{border-color:var(--accent)}
.tile canvas{width:48px;height:48px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--rule)}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw-custom{width:44px;height:32px;padding:0;border:1px solid var(--rule);border-radius:8px;background:none}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{text-align:center;font-family:var(--f-mono)}
.stepper button{min-width:38px;min-height:38px;border-radius:8px;border:1px solid var(--rule);background:var(--panel2)}
.kfrow{display:grid;grid-template-columns:minmax(70px,1fr) minmax(120px,1.6fr) 40px;gap:8px;align-items:center}
.kfrow .fl{font-size:.8rem;color:var(--muted)}
.vec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vec input{text-align:center;font-family:var(--f-mono);padding:6px 4px}
.vec label{display:flex;flex-direction:column;gap:2px;font-size:.7rem;color:var(--muted);text-align:center}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:6px 8px}
.li.on{border-color:var(--accent)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li input[type=text]{min-height:32px;padding:4px 8px}
.chk{display:flex;align-items:center;gap:8px;font-size:.88rem}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:14px;padding:16px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:1.05rem}
dialog video{width:100%;border-radius:8px;background:#000}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{text-align:left;justify-content:flex-start}
.toast{position:fixed;left:50%;top:calc(var(--barh) + 56px);transform:translateX(-50%) translateY(10px);background:#000;border:1px solid var(--rule);border-radius:99px;padding:8px 16px;font-size:.85rem;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* stage mode */
body.staging .modes,body.staging .tools,body.staging .bar{display:none}
.stageui{position:absolute;inset:0;pointer-events:none}
.stageui>*{pointer-events:auto}
.st-top{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st-top select{max-width:160px;min-height:38px}
.st-status{background:rgba(14,14,18,.7);border-radius:99px;padding:6px 12px;font:600 .85rem var(--f-mono)}
.st-status.rec{background:var(--rec);color:#fff}
.joy{position:absolute;bottom:14px;width:clamp(110px,26vmin,170px);height:clamp(110px,26vmin,170px);border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);touch-action:none}
.joy.l{left:14px}.joy.r{right:14px}
.joy .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(233,161,91,.85);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.joy .jl{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:.7rem;color:var(--muted)}
.trig{position:absolute;bottom:calc(clamp(110px,26vmin,170px) + 34px);width:48px;height:clamp(90px,20vmin,140px);border-radius:12px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);touch-action:none;overflow:hidden}
.trig.l{left:14px}.trig.r{right:14px}
.trig .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(233,161,91,.75)}
.trig .jl{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:.65rem;color:#fff;z-index:1}
.stbtn{position:absolute;bottom:calc(clamp(110px,26vmin,170px) + 34px);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);font-weight:700;touch-action:none}
.stbtn.a{right:74px}
.stbtn.on{background:var(--accent);color:var(--accent-ink)}
.padinfo{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:.75rem;color:var(--muted);background:rgba(14,14,18,.6);border-radius:99px;padding:4px 10px;white-space:nowrap}
canvas.graph{width:100%;height:auto;aspect-ratio:2/1;border-radius:10px;border:1px solid var(--rule);touch-action:none;display:block}
.abxy{position:absolute;right:calc(clamp(110px,26vmin,170px) + 30px);bottom:18px;width:120px;height:120px;pointer-events:none}
.abxy .stbtn{position:absolute;width:44px;height:44px;bottom:auto;pointer-events:auto}
.abxy .y{left:38px;top:0}.abxy .x{left:0;top:38px}.abxy .b{right:0;top:38px;left:auto}.abxy .a{left:38px;top:76px;right:auto}
@media (max-width:640px){.abxy{right:50%;transform:translateX(50%);bottom:calc(clamp(110px,26vmin,170px) + 40px)}}
.facebox{position:absolute;right:8px;top:96px;width:150px;background:rgba(14,14,18,.75);border:1px solid var(--rule);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.facevid{width:100%;border-radius:8px;transform:scaleX(-1);background:#000;aspect-ratio:4/3;object-fit:cover}
.facestat{font-size:.72rem;color:var(--muted);line-height:1.3}

.navwrap{position:absolute;right:62px;top:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.navgizmo{width:84px;height:84px;touch-action:none;cursor:grab;border-radius:50%}
.navlabel{background:rgba(14,14,18,.6);border:1px solid var(--rule);border-radius:99px;padding:3px 10px;font-size:.72rem;color:var(--muted);min-height:26px;white-space:nowrap}
.pop{position:absolute;z-index:30;background:rgba(23,23,29,.97);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;width:min(290px,calc(100% - 16px));box-shadow:0 10px 30px rgba(0,0,0,.45);max-height:calc(100% - 16px);overflow:auto}
.pop .btn{min-height:34px;padding:4px 8px;font-size:.8rem}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pseg{display:flex;gap:4px}.pseg .btn{flex:1}
.pop .chk{font-size:.8rem}
.pop p{margin:0}
body.staging .navwrap,body.staging #lockBtn{display:none}

</style>
<header class="bar">
  <a class="brand" href="./" aria-label="ClayForm"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#17171D"/><defs><radialGradient id="g" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#F6C9A0"/><stop offset=".55" stop-color="#E8A87C"/><stop offset="1" stop-color="#8E4F2E"/></radialGradient></defs><ellipse cx="32" cy="50" rx="15" ry="3.5" fill="#000" opacity=".35"/><path d="M32 13c10 0 17 7 17 17 0 11-7 18-17 18s-17-6-17-17c0-10 7-18 17-18z" fill="url(#g)"/><circle cx="26.5" cy="27" r="2.6" fill="#2B2B33"/><circle cx="37.5" cy="27" r="2.6" fill="#2B2B33"/><path d="M26 35c3.5 3 8.5 3 12 0" stroke="#2B2B33" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M50 9l4 4-4 4-4-4z" fill="#F2B35E"/></svg><b>ClayForm</b></a>
  <select id="proj" aria-label="Project"></select>
  <button id="menuBtn" class="iconbtn" type="button" aria-label="Projects and settings">⋯</button>
  <span class="grow"></span>
  <button id="undo" class="iconbtn" type="button" aria-label="Undo" title="Undo">↶</button>
  <button id="redo" class="iconbtn" type="button" aria-label="Redo" title="Redo">↷</button>
  <button id="exportBtn" class="btn primary" type="button">Export</button>
</header>
<div id="main" class="main">
  <div id="viewWrap" class="viewwrap">
    <canvas id="view" aria-label="3D view"></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div id="sliders" class="sliders" hidden>
      <label class="vs"><span>Size</span><input id="radius" type="range" min="8" max="200" value="50" aria-label="Brush size"></label>
      <label class="vs"><span>Strength</span><input id="strength" type="range" min="1" max="100" value="45" aria-label="Brush strength"></label>
      <label class="vs" title="How gently the brush fades out at its edge. Higher = a longer, softer fade, so no sharp dents or ridges"><span>Falloff</span><input id="softness" type="range" min="0" max="100" value="50" aria-label="Brush falloff"></label>
    </div>
    <div id="viewBtns" class="viewbtns">
      <button id="symBtn" class="vbtn tog" type="button" aria-pressed="true" title="Mirror across X">⇋ X</button>
      <button id="subBtn" class="vbtn tog" type="button" aria-pressed="false" title="Invert the brush" hidden>− Sub</button>
      <button id="frameBtn" class="vbtn" type="button" title="Frame the selection">⌖</button>
      <button id="camViewBtn" class="vbtn tog" type="button" aria-pressed="false" title="Look through the shot camera">🎥</button>
      <button id="renderBtn" class="vbtn tog" type="button" aria-pressed="false" title="Render view: lights, shadows and a floor">☀</button>
      <button id="wireBtn" class="vbtn tog" type="button" aria-pressed="false" title="Show the wireframe">▦</button>
      <button id="lockBtn" class="vbtn tog" type="button" aria-pressed="false" title="Axis lock: move along one axis, or in steps">✥ Free</button>
    </div>
    <div id="navWrap" class="navwrap">
      <canvas id="navGizmo" class="navgizmo" role="img" aria-label="View gizmo: tap an axis to look along it, drag to turn the view"></canvas>
      <button id="navLabel" class="navlabel" type="button" title="View options">Persp ▾</button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="stageUI" class="stageui" hidden></div>
  </div>
  <div class="modes" role="tablist" aria-label="Mode">
    <button type="button" role="tab" data-mode="sculpt">Sculpt</button>
    <button type="button" role="tab" data-mode="model">Model</button>
    <button type="button" role="tab" data-mode="objects">Objects</button>
    <button type="button" role="tab" data-mode="rig">Rig</button>
    <button type="button" role="tab" data-mode="pose">Pose</button>
    <button type="button" role="tab" data-mode="stage">Stage</button>
  </div>
  <div class="transport">
    <button class="playbtn" type="button" aria-label="Play">▶</button>

  // ---------- the demo: a little rigged clay buddy and a ball ----------

      { id: 'handR', name: 'Hand R', parent: 'armR', head: [0.86, 1.2, 0], tail: [1.3, 1.04, 0], mirror: 'handL' },
      { id: 'armL', name: 'Arm L', parent: 'chest', head: [-0.42, 1.36, 0], tail: [-0.86, 1.2, 0], mirror: 'armR' },
