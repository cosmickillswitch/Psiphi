<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Logos · Psi Phi Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#1b1b20;--bar:#24242b;--panel:#2b2b33;--panel2:#34343e;--ink:#ededf3;--muted:#9b9bab;--rule:#3b3b47;--accent:#e0a458;--z:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--bar);border-bottom:1px solid var(--rule)}
.brand{font-weight:700;white-space:nowrap}.brand b{color:var(--accent)}
#docName{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:220px}
#docName:focus{border-color:var(--rule);background:var(--panel)}
.grow{flex:1}
.tb{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--panel2)}
.tb.on{background:var(--panel2);border-color:var(--accent);color:var(--accent)}
.tb:disabled{opacity:.35}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ribbon{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--rule);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#ribbon::-webkit-scrollbar{display:none}
#ribbon select{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:5px 6px;height:34px}
#ribbon .sep{width:1px;height:24px;background:var(--rule);margin:0 4px;flex:none}
.sw{position:relative}
.sw i{position:absolute;left:7px;right:7px;bottom:5px;height:4px;border-radius:2px}
#ctxBar{display:none;align-items:center;gap:4px;padding:5px 10px;background:#202027;border-bottom:1px solid var(--rule);overflow-x:auto;font-size:13px}
#ctxBar.show{display:flex}
#ctxBar .lbl{color:var(--muted);margin-right:4px;white-space:nowrap}
#scroller{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#3a3a42;padding:28px 12px 80px}
#pageWrap{display:flex;justify-content:center}
#page{width:794px;min-height:1123px;background:#fff;color:#1d1d1f;padding:76px 84px;box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:3px;outline:none;zoom:var(--z);caret-color:#1d6fe0}
body.flow #page{min-height:0}
#status{display:flex;align-items:center;gap:14px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
#status b{color:var(--ink);font-weight:600}
/* the document */
.doc{font-family:"Georgia",serif;font-size:17px;line-height:1.55;word-wrap:break-word}
.doc p,.doc div:not([class]){margin:0 0 .7em}
.doc h1.title{font:700 34px/1.15 "Avenir Next","Helvetica Neue",sans-serif;margin:0 0 .5em;letter-spacing:-.01em}
.doc h1{font:700 26px/1.2 "Avenir Next","Helvetica Neue",sans-serif;margin:1em 0 .45em}
.doc h2{font:600 21px/1.25 "Avenir Next","Helvetica Neue",sans-serif;margin:.95em 0 .4em}
.doc h3{font:600 17px/1.3 "Avenir Next","Helvetica Neue",sans-serif;margin:.9em 0 .35em;text-transform:none;color:#3a3a40}
.doc blockquote{margin:.6em 0 .8em;padding:.2em 0 .2em 1em;border-left:4px solid #e0a458;color:#4a4a52;font-style:italic}
.doc pre{font:14px/1.45 "Menlo","Courier New",monospace;background:#f3f3f6;border:1px solid #e1e1e8;border-radius:6px;padding:10px 12px;white-space:pre-wrap;margin:.5em 0 .9em}
.doc ul,.doc ol{margin:0 0 .7em;padding-left:1.6em}
.doc li{margin:.15em 0}
.doc ul.check{list-style:none;padding-left:.3em}
.doc ul.check li .chk{display:inline-block;width:1.25em;cursor:pointer;-webkit-user-select:none;user-select:none}
.doc ul.check li.done{color:#8a8a92;text-decoration:line-through}
.doc a{color:#1d6fe0}
.doc hr{border:0;border-top:1px solid #cfcfd6;margin:1.2em 0}
.doc hr.pb{border-top:2px dashed #c4c4cc;margin:2em -84px}
.doc img{max-width:100%;height:auto;border-radius:3px}
.doc img.left{float:left;margin:.2em 1em .5em 0}.doc img.right{float:right;margin:.2em 0 .5em 1em}.doc img.centre{display:block;margin:.4em auto}
.doc img.sel{outline:3px solid #1d6fe0}
.doc table{border-collapse:collapse;width:100%;margin:.6em 0 1em;font-size:.92em}
.doc td,.doc th{border:1px solid #c9c9d2;padding:6px 8px;vertical-align:top;min-width:40px}
.doc table.hdr tr:first-child td,.doc table.hdr tr:first-child th{font-weight:700;background:#eef0f5}
.doc table.noborder td,.doc table.noborder th{border-color:transparent}
.doc table.stripes tr:nth-child(even) td{background:#f6f7fa}
.doc td.cur,.doc th.cur{box-shadow:inset 0 0 0 2px #1d6fe0}
/* screenplay */
.doc .sc-scene{font:700 16px/1.5 "Courier New",monospace;text-transform:uppercase;margin:1.4em 0 .6em}
.doc .sc-action{font:16px/1.5 "Courier New",monospace;margin:0 0 .8em}
.doc .sc-char{font:16px/1.5 "Courier New",monospace;text-transform:uppercase;margin:1em 0 0 37%}
.doc .sc-paren{font:16px/1.5 "Courier New",monospace;margin:0 0 0 30%;max-width:40%}
.doc .sc-dial{font:16px/1.5 "Courier New",monospace;margin:0 18% .8em 22%}
.doc .sc-trans{font:16px/1.5 "Courier New",monospace;text-transform:uppercase;text-align:right;margin:1em 0}
.doc .sc-note{font:italic 15px/1.45 "Avenir Next",sans-serif;color:#6b4fc8;background:#f3efff;border-radius:6px;padding:4px 8px;margin:.4em 0 .8em}
.doc .find{background:#ffe066;border-radius:2px}
.doc .find.now{background:#ff9f1c}
/* popovers & dialogs */
.pop{position:fixed;z-index:30;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 16px 36px rgba(0,0,0,.5);padding:10px;max-height:calc(100vh - 90px);overflow:auto}
.pop .mi{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.pop .mi:hover{background:var(--panel2)}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px}
.pop .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px}
.swatches{display:grid;grid-template-columns:repeat(8,26px);gap:5px}
.swatches i{width:26px;height:26px;border-radius:6px;cursor:pointer;border:1px solid rgba(0,0,0,.4)}
.tgrid{display:grid;grid-template-columns:repeat(8,22px);gap:3px}
.tgrid i{width:22px;height:22px;border:1px solid #555;border-radius:3px;background:#1f1f25}
.tgrid i.on{background:var(--accent);border-color:var(--accent)}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1306;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
#findBar{display:none;align-items:center;gap:6px;padding:6px 10px;background:#202027;border-bottom:1px solid var(--rule)}
#findBar.show{display:flex}
#findBar input{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:5px 8px;width:180px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{padding:12px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--panel2);cursor:pointer;text-align:left}
.choice button.on{border-color:var(--accent);background:#4a3a22}
.choice button:disabled{opacity:.4}
.choice b{display:block}
.choice small{color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(10,10,14,.94);border:1px solid var(--rule);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
#toast.show{opacity:1}
#gallery{position:fixed;inset:0;background:#141418;z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));overflow:auto}
#gallery[hidden]{display:none}
#gallery header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#gallery h1{margin:0;font-size:26px}
#glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.gcard{background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.gcard .pv{height:200px;background:#fff;color:#222;font:9px/1.35 Georgia,serif;padding:12px;overflow:hidden}
.gcard .meta{padding:8px 10px;font-size:13px}
.gcard small{color:var(--muted)}
.gcard .del{position:absolute;right:6px;top:6px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
#render{position:fixed;left:-30000px;top:0;background:#fff;color:#1d1d1f}
body.embed #galleryBtn{display:none}
@media print{body{overflow:visible;background:#fff}#top,#ribbon,#ctxBar,#findBar,#status{display:none!important}#app{position:static}#scroller{overflow:visible;background:#fff;padding:0}#page{box-shadow:none;width:auto;padding:0;zoom:1}.doc hr.pb{page-break-after:always;border:0;margin:0}}
@media (max-width:700px){#page{padding:36px 28px}#docName{width:120px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="tb" id="galleryBtn" title="All documents">▤</button>
    <span class="brand">¶ <b>Logos</b></span>
    <input id="docName" aria-label="Document name" maxlength="60">
    <button class="tb" id="undoBtn" title="Undo (two-finger tap)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb" id="redoBtn" title="Redo (three-finger tap)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="grow"></span>
    <button class="tb" id="scriptBtn" title="Screenplay mode: Tab changes the line type, Return moves on">🎬 Script</button>
    <button class="tb" id="findBtn" title="Find and replace">🔍</button>
    <button class="tb" id="menuBtn" title="Document">⋯</button>
  </header>
  <div id="ribbon"></div>
  <div id="ctxBar"></div>
  <div id="findBar"><input id="findIn" placeholder="Find"><input id="replIn" placeholder="Replace with"><button class="btn sm" id="fPrev">◀</button><button class="btn sm" id="fNext">▶</button><span id="fCount" class="small"></span><button class="btn sm" id="fRepl">Replace</button><button class="btn sm" id="fAll">Replace all</button><span class="grow"></span><button class="btn sm" id="fClose">Done</button></div>
  <main id="scroller"><div id="pageWrap"><div id="page" class="doc" contenteditable="true" spellcheck="true"></div></div></main>
  <footer id="status"><span id="stWords"></span><span id="stTime"></span><span class="grow"></span><button class="tb" id="zOut">−</button><span id="zLbl">100%</span><button class="tb" id="zIn">＋</button></footer>
</div>
<div id="gallery" hidden><header><h1>¶ Logos</h1><span class="grow"></span><button class="btn" id="gScript">＋ New script</button><button class="btn primary" id="gNew">＋ New document</button></header><div id="glist"></div></div>
<div id="render" class="doc"></div>
<div id="toast" role="status"></div>

  { let T = null; $('#scroller').addEventListener('touchstart', e => { if (!T) T = { t0: Date.now(), max: 0, x: e.touches[0].clientX, y: e.touches[0].clientY, moved: 0 }; T.max = Math.max(T.max, e.touches.length); }, { passive: true });
