<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Psi Phi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Psi Phi Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="./" aria-label="Psi Phi Studio"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" rx="44" fill="#000"/><path d="M40 150 C 70 150 75 55 100 55 C 125 55 130 150 160 150" fill="none" stroke="#58C4DD" stroke-width="12" stroke-linecap="round"/><circle cx="100" cy="55" r="15" fill="#F0AC5F"/><circle cx="62" cy="122" r="9" fill="#FC6255"/><circle cx="138" cy="122" r="9" fill="#83C167"/></svg><b>Psi Phi <span class="brand2">Studio</span></b></a>
  <nav class="menubar" aria-label="Menus"><button type="button" class="mb-btn" data-menu="File">File</button><button type="button" class="mb-btn" data-menu="Edit">Edit</button><button type="button" class="mb-btn" data-menu="Insert">Insert</button><button type="button" class="mb-btn" data-menu="View">View</button></nav>
  <select id="proj" aria-label="Project"></select>
  <button id="menuBtn" class="iconbtn" type="button" aria-label="Projects">⋯</button>
  <span class="grow"></span>
  <button id="aspectBtn" class="aspectbtn" type="button" aria-label="Video shape">16:9 ▾</button>
  <button id="exportBtn" class="btn primary" type="button">Export</button>
</header>
<div id="col" class="col">
  <div id="stageWrap"><canvas id="stage" aria-label="Animation preview"></canvas></div>
  <div class="transport">
    <span class="time"><span id="time">0:00.0</span> <span>/ <span id="dur">0:00.0</span></span></span>
    <span class="grow"></span>
    <button id="toStart" class="iconbtn" type="button" aria-label="Back to start">⏮</button>
    <button class="playbtn" type="button" aria-label="Play">▶</button>
    <button id="loopBtn" class="iconbtn tog" type="button" aria-pressed="false" aria-label="Loop playback" title="Loop">↻</button>
    <span class="grow"></span>
    <button id="guides" class="iconbtn tog" type="button" aria-pressed="false" aria-label="Coordinate grid" title="Grid">⌗</button>
    <button id="undo" class="iconbtn" type="button" aria-label="Undo" title="Undo">↶</button>
    <button id="redo" class="iconbtn" type="button" aria-label="Redo" title="Redo">↷</button>
  </div>
  <section id="timeline" class="tl" aria-label="Timeline"></section>
  <div id="tray" class="tray" hidden aria-label="Add"></div>
  <nav id="tools" class="tools" aria-label="Tools"></nav>
</div>
<aside id="sheet" class="sheet" hidden aria-label="Panel">
  <div class="sheet-head"><button class="playbtn small" type="button" aria-label="Play">▶</button><b id="sheetTitle"></b><button id="sheetClose" class="iconbtn" type="button" aria-label="Close panel">✕</button></div>
  <div id="sheetBody" class="sheet-body"></div>
</aside>
<dialog id="exportDlg" aria-label="Export"></dialog>
<dialog id="menuDlg" aria-label="Projects"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="core.js"></script>
<script src="elements.js"></script>
<script src="bio3d.js"></script>
<script src="sci2d.js"></script>
<script src="export.js"></script>
<script src="videnc.js"></script>
<script src="editor.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>{
  // an older ClayForm in a clayframe/ folder may have installed its own offline copy, which would keep serving stale files to the sculpt window
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/clayframe\/$/.test(r.scope))r.unregister();})).catch(()=>{});
  navigator.serviceWorker.register('sw.js').catch(()=>{});
});}</script>
</body>
</html>
