<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Final Stage · Psi Phi Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#111216;--bar:#1b1c21;--panel:#202228;--panel2:#2a2c34;--ink:#ececf2;--muted:#8f92a1;--rule:#33363f;--accent:#ff5a5f;--sel:#ffd166;--main:#3b6fd8;--over:#8a5cd8;--text:#d8873b;--audio:#2fa86f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
input,textarea{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto auto;grid-template-columns:270px 1fr 300px}
#top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 12px 6px;background:var(--bar);border-bottom:1px solid var(--rule)}
.brand{font-weight:700;white-space:nowrap}.brand b{color:var(--accent)}
#projName{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:220px}
#projName:focus{border-color:var(--rule);background:var(--panel)}
.grow{flex:1}
.tb{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:36px;height:36px;padding:0 10px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap}
.tb:hover{background:var(--panel2)}.tb:disabled{opacity:.35}
.tb.on{background:var(--panel2);border-color:var(--sel);color:var(--sel)}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4}
select{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:5px 7px}
/* left: library */
#lib{grid-row:2/3;grid-column:1;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;cursor:pointer;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--ink);font-weight:600}
#libBody{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/10;cursor:pointer;border:1px solid var(--rule)}
.mitem img{width:100%;height:100%;object-fit:cover;display:block}
.mitem .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--muted)}
.mitem .cap{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:11px;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .dur{position:absolute;right:5px;top:4px;font-size:10px;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:5px}
.mitem .add{position:absolute;left:5px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.mitem .del{position:absolute;right:4px;bottom:20px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:11px;display:none}
.mitem:hover .del{display:block}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);background:var(--panel2);border-radius:10px;padding:9px 10px;cursor:pointer;text-align:left;width:100%}
.pitem .sw{width:46px;height:30px;border-radius:6px;background:#000;display:grid;place-items:center;font-size:11px;overflow:hidden;flex:none}
.pitem small{color:var(--muted);display:block}
.hint{color:var(--muted);font-size:12px}
/* centre: preview */
#stage{grid-row:2/3;grid-column:2;display:flex;flex-direction:column;min-width:0;min-height:0;background:#0b0b0e}
#pvWrap{flex:1;position:relative;min-height:0;display:grid;place-items:center;padding:10px}
#pv{background:#000;box-shadow:0 0 0 1px #2a2c34;max-width:100%;max-height:100%;touch-action:none}
#pvBar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid var(--rule);background:var(--bar)}
#tc{font:600 13px ui-monospace,Menlo,monospace;min-width:150px}
/* right: inspector */
#insp{grid-row:2/3;grid-column:3;background:var(--panel);border-left:1px solid var(--rule);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.grp{border:1px solid var(--rule);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.grp>b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fld{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:8px;font-size:13px}
.fld input[type=range]{width:100%}
.fld input[type=number],.fld input[type=text],.fld select{width:100%;background:var(--panel2);border:1px solid var(--rule);border-radius:7px;padding:5px 7px}
.fld .v{min-width:38px;text-align:right;color:var(--muted);font-size:12px}
.kf{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px}
.kf.on{color:var(--sel)}
textarea{width:100%;min-height:70px;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:7px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--rule);background:var(--panel2);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
.chips button.on{background:var(--sel);border-color:var(--sel);color:#211;font-weight:600}
/* bottom: tools + timeline */
#tools{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--bar);border-top:1px solid var(--rule);overflow-x:auto}
#tlWrap{grid-column:1/-1;height:250px;display:grid;grid-template-columns:96px 1fr;background:#15161a;border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
#heads{overflow:hidden;border-right:1px solid var(--rule)}
#heads .h{height:52px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;color:var(--muted);border-bottom:1px solid #202228}
#heads .h b{color:var(--ink);font-weight:600}
#heads .rh{height:28px;border-bottom:1px solid var(--rule)}
#tl{position:relative;overflow:auto;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
#tlInner{position:relative;min-height:100%}
#ruler{position:sticky;top:0;height:28px;background:#1b1c21;border-bottom:1px solid var(--rule);z-index:3;cursor:pointer;touch-action:none}
#ruler span{position:absolute;top:6px;font:11px ui-monospace,Menlo,monospace;color:var(--muted);transform:translateX(3px)}
#ruler i{position:absolute;bottom:0;width:1px;height:8px;background:#55596a}
.lane{position:relative;height:52px;border-bottom:1px solid #202228}
.clip{position:absolute;top:5px;height:42px;border-radius:8px;overflow:hidden;cursor:grab;touch-action:none;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.clip.sel{border-color:var(--sel)}
.clip .lab{position:absolute;left:6px;top:3px;right:6px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.8);pointer-events:none}
.clip .th{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.55;pointer-events:none}
.clip canvas.wave{position:absolute;left:0;bottom:0;width:100%;height:28px;pointer-events:none;opacity:.8}
.clip .hd{position:absolute;top:0;bottom:0;width:14px;background:rgba(255,209,102,.9);display:none;touch-action:none;cursor:ew-resize}
.clip.sel .hd{display:block}
.clip .hd.l{left:0;border-radius:6px 0 0 6px}.clip .hd.r{right:0;border-radius:0 6px 6px 0}
.clip .tr{position:absolute;left:-1px;top:13px;width:16px;height:16px;border-radius:4px;background:#fff;color:#000;font-size:10px;display:grid;place-items:center;pointer-events:none}
.clip .kd{position:absolute;bottom:2px;width:7px;height:7px;background:var(--sel);transform:translateX(-3px) rotate(45deg);pointer-events:none}
#playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:4;pointer-events:none}
#playhead::before{content:'';position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid #fff}
.gapdrop{position:absolute;top:2px;bottom:2px;width:3px;background:var(--sel);z-index:5;pointer-events:none;display:none}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:18px;padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:19px}
.dlg video{width:100%;border-radius:10px;background:#000;max-height:40vh}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
progress{width:100%}
#toast{position:fixed;left:50%;bottom:290px;transform:translateX(-50%);background:rgba(10,10,14,.94);border:1px solid var(--rule);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
body.embed .brand{display:none}
#drop{position:fixed;inset:0;background:rgba(255,90,95,.15);border:3px dashed var(--accent);z-index:60;display:none;place-items:center;font-size:22px;font-weight:700}
@media (max-width:980px){#app{grid-template-columns:220px 1fr 250px}#projName{width:140px}}
@media (max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto 40vh auto auto auto}#lib,#insp{display:none}#lib.show,#insp.show{display:flex;position:fixed;top:60px;bottom:330px;width:min(320px,90vw);z-index:20}#lib.show{left:0}#insp.show{right:0}#stage{grid-column:1}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand">🎬 <b>Final Stage</b></span>
    <input id="projName" aria-label="Project name" maxlength="60">
    <button class="tb" id="undoBtn" title="Undo">↶</button><button class="tb" id="redoBtn" title="Redo">↷</button>
    <span class="grow"></span>
    <select id="aspect" title="Shape of the video"><option value="16:9">16:9 landscape</option><option value="9:16">9:16 portrait</option><option value="1:1">1:1 square</option><option value="4:5">4:5</option><option value="4:3">4:3</option><option value="21:9">21:9 cinema</option></select>
    <button class="tb" id="projBtn" title="Projects">▤ Projects</button>
    <button class="btn primary" id="exportBtn">⤓ Export</button>
  </header>
  <aside id="lib">
    <div class="tabs" id="libTabs"></div>
    <div id="libBody"></div>
  </aside>
  <section id="stage">
    <div id="pvWrap"><canvas id="pv"></canvas></div>
    <div id="pvBar">
      <button class="tb" id="toStart" title="Back to the start">⏮</button>
      <button class="tb" id="playBtn" title="Play (space)" style="font-size:18px">▶</button>
      <span id="tc">00:00.00 / 00:00.00</span>
      <span class="grow"></span>
      <button class="tb" id="fullBtn" title="Full-screen preview">⛶</button>
    </div>
  </section>
  <aside id="insp"></aside>
  <div id="tools"></div>
  <div id="tlWrap"><div id="heads"></div><div id="tl"><div id="tlInner"><div id="ruler"></div><div id="lanes"></div><div id="playhead"></div><div class="gapdrop" id="gapdrop"></div></div></div></div>
</div>
<div id="toast" role="status"></div>
<div id="drop">Drop videos, pictures or sound</div>
<script src="videnc.js"></script>
<script>
'use strict';
(() => {
  const $ = s => document.querySelector(s);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k in e && k !== 'list') try { e[k] = v; } catch (x) { e.setAttribute(k, v); } else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const r3 = v => Math.round(v * 1000) / 1000;
  let tt = 0; const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2400); };
  const fmt = (s, cs) => { s = Math.max(0, s); const m = Math.floor(s / 60), x = s - m * 60; return String(m).padStart(2, '0') + ':' + (cs === false ? String(Math.floor(x)).padStart(2, '0') : x.toFixed(2).padStart(5, '0')); };
  const QS = new URLSearchParams(location.search), EMBED = QS.has('embed'); if (EMBED) document.body.classList.add('embed');
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  /* ================= storage: media (files) and projects ================= */
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const open = v => { const r = v ? indexedDB.open('psiphi-final', v) : indexedDB.open('psiphi-final'); r.onupgradeneeded = () => { for (const s of ['media', 'projects']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); }; r.onsuccess = () => { const d = r.result; if (['media', 'projects'].every(s => d.objectStoreNames.contains(s))) res(d); else { const nv = d.version + 1; d.close(); open(nv); } }; r.onerror = () => rej(r.error); };
    open(0);
  }));
  const tx = async (store, mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(store, mode), st = t.objectStore(store); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const getAll = store => tx(store, 'readonly', st => st.getAll()).then(x => x || []).catch(() => []);

  /* ================= media ================= */
  const MEDIA = new Map();      // id → { rec, url, kind: 'video'|'image'|'audio', dur, w, h, img, thumb, buf (decoded sound), peaks }
  const kindOf = t => /^video/.test(t) ? 'video' : /^image/.test(t) ? 'image' : /^audio/.test(t) ? 'audio' : null;
  async function loadMedia(rec) {
    if (MEDIA.has(rec.id)) return MEDIA.get(rec.id);
    const m = { rec, url: URL.createObjectURL(rec.blob), kind: kindOf(rec.type || rec.blob.type) || 'video', dur: rec.dur || 0, w: rec.w || 0, h: rec.h || 0, thumb: rec.thumb || null };
    MEDIA.set(rec.id, m);
    if (m.kind === 'image') { m.img = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = m.url; }); if (m.img) { m.w = m.img.naturalWidth; m.h = m.img.naturalHeight; } m.dur = 0; if (!m.thumb && m.img) m.thumb = thumbOf(m.img, m.w, m.h); }
    else if (!m.dur || (m.kind === 'video' && !m.thumb)) await probe(m);
    if (!rec.dur && m.dur || !rec.thumb && m.thumb) { rec.dur = m.dur; rec.w = m.w; rec.h = m.h; rec.thumb = m.thumb; tx('media', 'readwrite', st => st.put(rec)).catch(() => { }); }
    return m;
  }
  function thumbOf(src, w, hh) { const c = h('canvas'); c.width = 160; c.height = Math.max(1, Math.round(160 * (hh || 9) / (w || 16))); try { c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.7); } catch (e) { return null; } }
  function probe(m) {
    return new Promise(res => {
      const el = h(m.kind === 'audio' ? 'audio' : 'video', { preload: 'auto', muted: true, playsInline: true }); el.setAttribute('playsinline', ''); el.muted = true;
      let done = false; const fin = () => { if (done) return; done = true; res(); };
      el.addEventListener('loadedmetadata', () => { m.dur = isFinite(el.duration) ? el.duration : 5; m.w = el.videoWidth || 0; m.h = el.videoHeight || 0; if (m.kind === 'audio') fin(); else el.currentTime = Math.min(0.2, m.dur / 2); });
      el.addEventListener('seeked', () => { if (m.kind === 'video') m.thumb = thumbOf(el, m.w, m.h); fin(); });
      el.addEventListener('error', fin); setTimeout(fin, 6000);
      el.src = m.url;
    });
  }
  async function addFiles(files) {
    const added = [];
    for (const f of files) {
      const k = kindOf(f.type) || (/\.(mp4|mov|m4v|webm)$/i.test(f.name) ? 'video' : /\.(png|jpe?g|gif|webp|heic)$/i.test(f.name) ? 'image' : /\.(mp3|m4a|wav|aac|ogg|caf)$/i.test(f.name) ? 'audio' : null);
      if (!k) { toast('Skipped ' + f.name + ' (not a video, picture or sound)'); continue; }
      const rec = { id: 'm_' + uid(), name: f.name.replace(/\.[^.]+$/, '').slice(0, 40), type: f.type || (k + '/*'), blob: f, created: Date.now() };
      await tx('media', 'readwrite', st => st.put(rec)); const m = await loadMedia(rec); added.push(m);
    }
    renderLib(); return added;
  }
  function pickFiles() { const i = h('input', { type: 'file', multiple: true, accept: 'video/*,image/*,audio/*', style: 'position:fixed;left:-9999px' }); i.addEventListener('change', async () => { const fs = [...i.files]; i.remove(); if (!fs.length) return; const ms = await addFiles(fs); if (ms.length === 1) addClipFromMedia(ms[0]); else if (ms.length) toast('Added ' + ms.length + ' items to Media. Tap ＋ to put them on the timeline.'); }); document.body.append(i); i.click(); }
  // the sound inside a video or sound file, decoded once, for export and waveforms
  let ac = null; const actx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
  async function soundOf(m) {
    if (m.buf !== undefined) return m.buf;
    if (m.kind === 'image') return (m.buf = null);
    try { const ab = await m.rec.blob.arrayBuffer(); m.buf = await new Promise((res, rej) => { const p = actx().decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); }); }
    catch (e) { m.buf = null; }
    if (m.buf) { const d = m.buf.getChannelData(0), n = 400, step = Math.max(1, Math.floor(d.length / n)), pk = new Float32Array(n); for (let i = 0; i < n; i++) { let mx = 0; for (let j = i * step; j < Math.min(d.length, (i + 1) * step); j += 8) mx = Math.max(mx, Math.abs(d[j])); pk[i] = mx; } m.peaks = pk; }
    return m.buf;
  }

  /* ================= project ================= */
  let P = null, sel = null, time = 0, playing = false, pps = 60;
  const TRACKS = [{ id: 'text', kind: 'text', name: 'Text', icon: 'T' }, { id: 'over2', kind: 'over', name: 'Overlay 2', icon: '▣' }, { id: 'over', kind: 'over', name: 'Overlay', icon: '▣' }, { id: 'main', kind: 'main', name: 'Main', icon: '🎞' }, { id: 'audio', kind: 'audio', name: 'Sound', icon: '♪' }, { id: 'audio2', kind: 'audio', name: 'Sound 2', icon: '♪' }];
  const newProject = () => ({ id: 'fp_' + uid(), name: 'Untitled film', aspect: '16:9', clips: [], created: Date.now(), updated: Date.now() });
  const DEF_TR = () => ({ x: 0, y: 0, s: 1, r: 0, o: 1 });
  const newClip = (track, o) => Object.assign({ id: 'c_' + uid(), track, start: 0, dur: 4, in: 0, speed: 1, vol: 1, mute: false, fadeIn: 0, fadeOut: 0, fit: 'contain', blend: 'source-over', tr: DEF_TR(), keys: {}, fx: {}, anim: { in: 'none', out: 'none' }, trans: { type: 'none', dur: 0.6 } }, o);
  const byId = id => P.clips.find(c => c.id === id);
  const trackOf = c => TRACKS.find(t => t.id === c.track) || TRACKS[3];
  const mainClips = () => P.clips.filter(c => c.track === 'main');
  // the main track is magnetic: clips follow each other, and a transition overlaps the two clips it joins
  function layout() {
    let t = 0;
    mainClips().forEach((c, i, arr) => { const prev = arr[i - 1]; let ov = 0; if (prev && c.trans && c.trans.type !== 'none') ov = Math.min(c.trans.dur, prev.dur / 2, c.dur / 2); c._ov = ov; t -= ov; c.start = r3(t); t += c.dur; });
  }
  const total = () => { layout(); return Math.max(0.5, ...P.clips.map(c => c.start + c.dur)); };
  const srcLen = c => { const m = MEDIA.get(c.media); return m && m.kind !== 'image' && m.dur ? m.dur : Infinity; };
  function addClipFromMedia(m, track) {
    commitHist();
    const kind = m.kind, tr = track || (kind === 'audio' ? 'audio' : 'main');
    const dur = kind === 'image' ? 4 : Math.max(0.2, m.dur || 4);
    const c = newClip(tr, { media: m.rec.id, name: m.rec.name, dur, kind });
