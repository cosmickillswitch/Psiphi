<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>8-Bit · Psi Phi Studio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#1c1c21;--panel:#26262d;--panel2:#30303a;--panel3:#3b3b47;--ink:#ececf3;--muted:#9a9aab;--rule:#3d3d4a;--accent:#f0ac5f;--accent2:#58c4dd;--danger:#ff6b6b;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","IBM Plex Sans",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
input,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:5px 8px}
#app{position:fixed;inset:0;display:grid;grid-template-columns:62px 1fr 272px;grid-template-rows:50px 1fr auto;grid-template-areas:"top top top" "tools stage side" "time time side"}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
#top .title{font-weight:700;margin-right:6px;white-space:nowrap}
#top .title b{color:var(--accent)}
#docName{width:150px;background:transparent;border-color:transparent}
#docName:focus{border-color:var(--rule);background:var(--panel2)}
.grow{flex:1}
.ib{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 8px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--panel2)}
.ib.on{background:var(--panel3);border-color:var(--accent);color:var(--accent)}
.ib:disabled{opacity:.35}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib small{font-size:11px;color:var(--muted);margin-left:4px}
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow-y:auto}
#tools .ib{width:46px;height:44px}
#tools .sep{width:34px;height:1px;background:var(--rule);margin:4px 0}
#stage{grid-area:stage;position:relative;overflow:hidden;background:#2a2a31;touch-action:none}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#opts{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#opts>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(30,30,36,.92);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;font-size:13px;backdrop-filter:blur(6px)}
.chip button{border:0;background:var(--panel3);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip button.on{background:var(--accent);color:#1b1206}
#zoomInfo{position:absolute;right:10px;bottom:10px;font-size:12px;color:var(--muted);background:rgba(30,30,36,.85);padding:3px 8px;border-radius:999px;pointer-events:none}
#side{grid-area:side;background:var(--panel);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.sec{border-bottom:1px solid var(--rule);padding:10px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.sec h3 .grow{flex:1}
.sec h3 select{font-size:12px;padding:2px 6px;text-transform:none;letter-spacing:0}
#swatches{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sw{position:relative;width:44px;height:44px;border-radius:10px;border:2px solid var(--rule);cursor:pointer;overflow:hidden}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,172,95,.35)}
.sw i,.cell i{position:absolute;inset:0}
.checker{background-color:#bbb;background-image:linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%),linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%);background-size:10px 10px;background-position:0 0,5px 5px}
#hsv{position:relative;width:100%;height:120px;border-radius:8px;overflow:hidden;touch-action:none}
#hue,#alpha{width:100%;height:16px;border-radius:8px;margin-top:8px;touch-action:none;display:block}
#hex{width:92px;font-family:ui-monospace,Menlo,monospace}
#palette{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.cell{position:relative;aspect-ratio:1;border-radius:4px;cursor:pointer;border:1px solid rgba(0,0,0,.4);overflow:hidden}
.cell.on{outline:2px solid #fff;outline-offset:1px;z-index:1}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--panel2);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{background:var(--panel3)}
.btn.primary{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
#layers{display:flex;flex-direction:column;gap:4px}
.lay{display:flex;align-items:center;gap:8px;padding:5px;border-radius:8px;background:var(--panel2);border:1px solid transparent;cursor:pointer}
.lay.on{border-color:var(--accent);background:var(--panel3)}
.lay canvas{width:36px;height:36px;border-radius:5px;image-rendering:pixelated;flex:none}
.lay .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay .tg{border:0;background:transparent;cursor:pointer;width:28px;height:28px;border-radius:6px;opacity:.85}
.lay .tg.off{opacity:.3}
#time{grid-area:time;background:var(--panel);border-top:1px solid var(--rule);display:flex;align-items:center;gap:8px;padding:8px 10px;min-width:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#frames{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.fr{position:relative;flex:none;width:58px;height:58px;border-radius:8px;border:2px solid var(--rule);cursor:pointer;overflow:hidden}
.fr.on{border-color:var(--accent)}
.fr canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.fr span{position:absolute;left:3px;bottom:1px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
#fps{width:52px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(10,10,14,.94);color:#fff;border:1px solid var(--rule);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:80vw;text-align:center}
#toast.show{opacity:1}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:16px;padding:0;max-width:min(560px,94vw);width:94vw}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:18px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sizes button{padding:14px 6px;border-radius:10px;border:1px solid var(--rule);background:var(--panel2);cursor:pointer}
.sizes button:hover{border-color:var(--accent)}
.sizes button b{display:block;font-size:16px}
.sizes button small{color:var(--muted)}
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
#gallery{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));overflow:auto}
#gallery[hidden]{display:none}
#gallery header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
#gallery h1{margin:0;font-size:26px}
#gallery h1 b{color:var(--accent)}
#glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gcard{background:var(--panel);border:1px solid var(--rule);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.gcard img{display:block;width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated}
.gcard div{padding:8px 10px;font-size:13px}
.gcard small{color:var(--muted)}
.gcard .del{position:absolute;right:6px;top:6px;border:0;border-radius:999px;width:28px;height:28px;background:rgba(0,0,0,.6);cursor:pointer}
body.embed #galleryBtn{display:none}
@media (max-width:820px){#app{grid-template-columns:54px 1fr 220px}#docName{width:100px}}
@media (max-width:620px){#app{grid-template-columns:52px 1fr;grid-template-rows:50px 1fr auto auto;grid-template-areas:"top top" "tools stage" "time time" "side side"}#side{max-height:36vh}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="galleryBtn" title="Gallery">▦<small>Gallery</small></button>
    <span class="title">▦ <b>8-Bit</b></span>
    <input id="docName" aria-label="Name" maxlength="40">
    <button class="ib" id="undoBtn" title="Undo (two-finger tap)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="redoBtn" title="Redo (three-finger tap)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <span class="grow"></span>
    <button class="ib" id="mirXBtn" title="Mirror left–right"><svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M8 7l-4 5 4 5M16 7l4 5-4 5"/></svg></button>
    <button class="ib" id="mirYBtn" title="Mirror top–bottom"><svg viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="2 2"/><path d="M7 8l5-4 5 4M7 16l5 4 5-4"/></svg></button>
    <button class="ib on" id="gridBtn" title="Pixel grid"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16"/></svg></button>
    <button class="ib" id="onionBtn" title="Onion skin"><svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6" stroke-dasharray="2 2"/></svg></button>
    <button class="ib" id="fitBtn" title="Fit to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="menuBtn" title="Canvas and export"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <nav id="tools" aria-label="Tools"></nav>
  <main id="stage"><canvas id="view"></canvas><div id="opts"></div><div id="zoomInfo"></div></main>
  <aside id="side">
    <div class="sec">
      <h3>Colour</h3>
      <div id="swatches">
        <div class="sw on checker" id="sw1" title="Main colour"><i></i></div>
        <button class="ib" id="swapBtn" title="Swap colours (X)">⇄</button>
        <div class="sw checker" id="sw2" title="Second colour (dither, right-click)"><i></i></div>
        <span class="grow"></span>
        <input id="hex" aria-label="Hex colour" maxlength="9">
      </div>
      <canvas id="hsv"></canvas>
      <canvas id="hue"></canvas>
      <canvas id="alpha"></canvas>
    </div>
    <div class="sec">
      <h3>Palette <span class="grow"></span><select id="palSel" aria-label="Palette"></select></h3>
      <div id="palette"></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="palAdd">＋ Add colour</button><button class="btn sm" id="palDel">− Remove</button><button class="btn sm" id="palFromArt" title="Collect every colour used">From artwork</button></div>
    </div>
    <div class="sec" style="flex:1">
      <h3>Layers <span class="grow"></span><button class="btn sm" id="layAdd" title="New layer">＋</button><button class="btn sm" id="layDup" title="Duplicate layer">⧉</button><button class="btn sm" id="layUp" title="Move up">↑</button><button class="btn sm" id="layDown" title="Move down">↓</button><button class="btn sm" id="layMerge" title="Merge down">⤓</button><button class="btn sm" id="layDel" title="Delete layer">🗑</button></h3>
      <div id="layers"></div>
      <div class="row" style="margin-top:8px"><span class="small" style="color:var(--muted);font-size:12px">Opacity</span><input type="range" id="layOp" min="0" max="100" style="flex:1"></div>
    </div>
  </aside>
  <footer id="time">
    <button class="ib" id="playBtn" title="Play"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg></button>
    <label style="font-size:12px;color:var(--muted)">fps <input id="fps" type="number" min="1" max="60"></label>
    <div id="frames"></div>
    <button class="ib" id="frAdd" title="New blank frame">＋</button>
    <button class="ib" id="frDup" title="Duplicate frame">⧉</button>
    <button class="ib" id="frLeft" title="Move frame earlier">◀</button>
    <button class="ib" id="frRight" title="Move frame later">▶</button>
    <button class="ib" id="frDel" title="Delete frame">🗑</button>
  </footer>
</div>
<div id="gallery" hidden>
  <header><h1>▦ <b>8-Bit</b></h1><span class="grow"></span><button class="btn primary" id="gNew">＋ New pixel art</button></header>
  <div id="glist"></div>
</div>
<div id="toast" role="status"></div>
<script>
'use strict';
(() => {
  const $ = s => document.querySelector(s);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs || {})) { if (v == null || v === false) continue; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else if (k in e && k !== 'list') try { e[k] = v; } catch (x) { e.setAttribute(k, v); } else e.setAttribute(k, v); } for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : String(c)); return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let tt = 0; const toast = (m, ms) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 2200); };
  const QS = new URLSearchParams(location.search), EMBED = QS.has('embed');
  if (EMBED) document.body.classList.add('embed');

  /* ---------- palettes ---------- */
  const PALETTES = {
    pico8: ['PICO-8', '#000000 #1d2b53 #7e2553 #008751 #ab5236 #5f574f #c2c3c7 #fff1e8 #ff004d #ffa300 #ffec27 #00e436 #29adff #83769c #ff77a8 #ffccaa'],
    sweetie16: ['Sweetie 16', '#1a1c2c #5d275d #b13e53 #ef7d57 #ffcd75 #a7f070 #38b764 #257179 #29366f #3b5dc9 #41a6f6 #73eff7 #f4f4f4 #94b0c2 #566c86 #333c57'],
    endesga32: ['Endesga 32', '#be4a2f #d77643 #ead4aa #e4a672 #b86f50 #733e39 #3e2731 #a22633 #e43b44 #f77622 #feae34 #fee761 #63c74d #3e8948 #265c42 #193c3e #124e89 #0099db #2ce8f5 #ffffff #c0cbdc #8b9bb4 #5a6988 #3a4466 #262b44 #181425 #ff0044 #68386c #b55088 #f6757a #e8b796 #c28569'],
    gameboy: ['Game Boy', '#0f380f #306230 #8bac0f #9bbc0f'],
    greys: ['Greys', '#000000 #222222 #444444 #666666 #888888 #aaaaaa #cccccc #eeeeee #ffffff'],
    pastel: ['Pastel', '#2b2d42 #8d99ae #edf2f4 #ffadad #ffd6a5 #fdffb6 #caffbf #9bf6ff #a0c4ff #bdb2ff #ffc6ff #fffffc'],
    custom: ['Custom', '']
  };
  const hex2rgba = s => { s = String(s || '').trim().replace('#', ''); if (s.length === 3) s = s.split('').map(c => c + c).join(''); if (s.length === 6) s += 'ff'; if (!/^[0-9a-f]{8}$/i.test(s)) return null; return [0, 2, 4, 6].map(i => parseInt(s.slice(i, i + 2), 16)); };
  const rgba2hex = (c, withA) => '#' + c.slice(0, withA || c[3] < 255 ? 4 : 3).map(v => v.toString(16).padStart(2, '0')).join('');
  const css = c => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (c[3] / 255).toFixed(3) + ')';
  const same = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];

  /* ---------- document ---------- */
  let doc = null, cur = { frame: 0, layer: 0 };
  const W = () => doc.w, H = () => doc.h;
  const newLayer = n => ({ id: 'L' + uid(), name: n || 'Layer', visible: true, opacity: 1 });
  function newDoc(w, hh, name) {
    w = clamp(Math.round(w) || 32, 1, 512); hh = clamp(Math.round(hh) || 32, 1, 512);
    return { id: 'px_' + uid(), name: name || 'Pixel art ' + w + '×' + hh, w, h: hh, fps: 8, layers: [newLayer('Layer 1')], frames: [{ cels: [new Uint8ClampedArray(w * hh * 4)] }], palette: PALETTES.pico8[1].split(' '), palName: 'pico8', created: Date.now(), updated: Date.now() };
  }
  const cel = (f, l) => doc.frames[f == null ? cur.frame : f].cels[l == null ? cur.layer : l];

  /* ---------- storage (IndexedDB) ---------- */
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('biostage-pixelart', 1); r.onupgradeneeded = () => r.result.createObjectStore('projects', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('projects', mode), st = t.objectStore('projects'); const q = fn(st); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const loadProj = id => tx('readonly', st => st.get(id)).catch(() => null);
  const listProj = () => tx('readonly', st => st.getAll()).catch(() => []);
  const delProj = id => tx('readwrite', st => st.delete(id));
  let saveT = 0;
  function thumbURL() { const c = composeCanvas(0, 'thumb'), k = Math.max(1, Math.floor(160 / Math.max(doc.w, doc.h))), t = document.createElement('canvas'); t.width = doc.w * k; t.height = doc.h * k; const x = t.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, t.width, t.height); return t.toDataURL('image/png'); }
  async function saveNow() { if (!doc) return; clearTimeout(saveT); doc.updated = Date.now(); try { const thumb = thumbURL(); await tx('readwrite', st => st.put(Object.assign({}, doc, { thumb }))); } catch (e) { console.warn('save failed', e); } }
  const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(saveNow, 700); };

  /* ---------- history ---------- */
  const hist = []; let hpos = 0;
  const cloneDoc = () => ({ w: doc.w, h: doc.h, fps: doc.fps, layers: doc.layers.map(l => Object.assign({}, l)), frames: doc.frames.map(f => ({ cels: f.cels.map(c => c.slice()) })), cur: Object.assign({}, cur) });
  const restoreDoc = s => { doc.w = s.w; doc.h = s.h; doc.fps = s.fps; doc.layers = s.layers.map(l => Object.assign({}, l)); doc.frames = s.frames.map(f => ({ cels: f.cels.map(c => c.slice()) })); cur = Object.assign({}, s.cur); };
  function push(entry) { hist.length = hpos; hist.push(entry); if (hist.length > 120) hist.shift(); hpos = hist.length; changed(); }
  function pushCel(f, lid, before) { const li = doc.layers.findIndex(l => l.id === lid); const after = doc.frames[f].cels[li].slice(); push({ k: 'cel', f, lid, before, after }); }
  function structural(label, fn) { const before = cloneDoc(); fn(); push({ k: 'doc', before, after: cloneDoc(), label }); }
  function applyEntry(e, dir) {
    if (e.k === 'cel') { const li = doc.layers.findIndex(l => l.id === e.lid); if (li < 0 || !doc.frames[e.f]) return; doc.frames[e.f].cels[li].set(dir < 0 ? e.before : e.after); cur.frame = e.f; }
    else restoreDoc(dir < 0 ? e.before : e.after);
  }
  function undo() { commitFloat(); if (hpos <= 0) return toast('Nothing to undo'); applyEntry(hist[--hpos], -1); changed(true); toast('Undo'); }
  function redo() { if (hpos >= hist.length) return toast('Nothing to redo'); applyEntry(hist[hpos++], 1); changed(true); toast('Redo'); }

  /* ---------- state ---------- */
  let tool = 'pencil', size = 1, pixelPerfect = true, fillAll = false, shapeFill = false, shadeDark = true, mirX = false, mirY = false, grid = true, onion = false;
  let colors = [[0, 0, 0, 255], [255, 255, 255, 255]], active = 0, palSel = -1;
  let view = { z: 8, ox: 0, oy: 0 }, dpr = 1;
  let sel = null, float = null, moveOff = null, preview = null, stroke = null, playing = false, playT = 0;
  const TOOLS = [
    ['pencil', 'Pencil (B)', '<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>'],
